version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payease}
      POSTGRES_USER: ${POSTGRES_USER:-payease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payease}
    # Removed ports binding to host for better security. Only internal services can access.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payease} -d ${POSTGRES_DB:-payease}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    # Removed ports binding to host for better security.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  listener:
    build: .
    command: python -m app.listeners.avalanche
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
